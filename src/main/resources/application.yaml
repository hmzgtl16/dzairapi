server:
  port: 8080

spring:
  application:
    name: dzairapi
  profiles:
    default: dev
  mvc:
    apiversion:
      supported:
        - 1.0
      default: 1.0
      use:
        path-segment: 1
    problemdetails:
      enabled: true
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
  kotlinx:
    serialization:
      json:
        naming-strategy: kebab_case
  threads:
    virtual:
      enabled: true
  cache:
    jcache:
      provider: com.github.benmanes.caffeine.jcache.spi.CaffeineCachingProvider
    cache-names:
      - dzairapi-filter-config-cache
      - dzairapi-rate-limit-buckets
    caffeine:
      spec: maximumSize=1000000,expireAfterAccess=3600s

springdoc:
  api-docs:
    path: /openapi
    resolve-schema-properties: true
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    display-request-duration: true
  show-actuator: true

logging:
  level:
    org.hibernate.validator.internal.metadata.aggregated.CascadingMetaDataBuilder: error
    org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration: off

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: false

bucket4j:
  enabled: true
  filter-config-caching-enabled: true
  filter-config-cache-name: dzairapi-filter-config-cache

  filters:
    - id: dzairapi-rate-limit-filter
      cache-name: dzairapi-rate-limit-buckets
      filter-method: servlet
      url: .*
      http-content-type: application/problem+json
      http-status-code: too_many_requests
      http-response-body: |
        {
          "type": "about:blank",
          "title": "Too Many Requests",
          "status": 429,
          "detail": "Rate limit exceeded."
        }
      rate-limits:
        - cache-key: getRemoteAddr()
          bandwidths:
            - capacity: 10
              refill-capacity: 1
              time: 10
              unit: seconds
              initial-capacity: 5
              refill-speed: interval
