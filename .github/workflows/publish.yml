name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7.0.1

    - uses: actions/setup-java@v6.0.1
      with:
        java-version: '25'
        distribution: 'liberica-nik'

    - uses: gradle/actions/setup-gradle@v6.3.0
    - run: chmod +x ./gradlew
    - run: ./gradlew bootBuildImage --imageName=${{ env.IMAGE }}:${{ github.ref_name }}

    - uses: docker/login-action@v4.8.0
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - run: docker push ${{ env.IMAGE }}:${{ github.ref_name }}
    
